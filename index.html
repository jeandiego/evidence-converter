<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evidence GIF Converter</title>
    <style>
      html,
      body,
      #root {
        background: transparent !important;
      }

      html.platform-macos,
      html.platform-windows,
      html.platform-macos body,
      html.platform-windows body,
      html.platform-macos #root,
      html.platform-windows #root {
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
      }

      html:not(.platform-macos):not(.platform-windows),
      html:not(.platform-macos):not(.platform-windows) body,
      html:not(.platform-macos):not(.platform-windows) #root {
        background: #1a1d23 !important;
      }
    </style>
    <script>
      (function () {
        var platform = navigator.platform || "";
        if (/Mac/i.test(platform)) {
          document.documentElement.classList.add("platform-macos");
        } else if (/Win/i.test(platform)) {
          document.documentElement.classList.add("platform-windows");
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
